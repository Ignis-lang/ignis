# The tasks API app: a layered (hexagonal) web service.
[package]
name = "tasks-api"
version = "0.1.0"

[ignis]
std = true
std_path = "../../std"

[aliases]
"@" = "./src"

# The in-process suite lives in @tests (src/tests/tasks_test.ign) and is
# discovered by `ignis test`; no e2e fixture directories are registered.
[test]
fixtures = []

[build]
bin = true
source_dir = "src"
entry = "main.ign"
out_dir = "build"
opt_level = 0
debug = false
target = "c"
cc = "gcc"
cflags = []
emit = []
