# Ignis Standard Library Manifest
#
# This file describes the available modules and their linking requirements.

[toolchain]
include_dirs = ["."]

[modules]
# Module name = relative path to .ign file
compile = "compile/mod.ign"
libc = "libc/mod.ign"
io = "io/mod.ign"
math = "math/mod.ign"
string = "string/mod.ign"
char = "char/mod.ign"
number = "number/mod.ign"
types = "types/mod.ign"
option = "option/mod.ign"
result = "result/mod.ign"
memory = "memory/mod.ign"
hash = "hash/mod.ign"
collections = "collections/mod.ign"
vector = "vector/mod.ign"
ptr = "ptr/mod.ign"
terminal = "terminal/mod.ign"
cli = "cli/mod.ign"
path = "path/mod.ign"
sort = "sort/mod.ign"
rc = "rc/mod.ign"
ffi = "ffi/mod.ign"
fs = "fs/mod.ign"
env = "env/mod.ign"
process = "process/mod.ign"
process_runtime = "process/runtime/mod.ign"
test = "test/mod.ign"
time = "time/mod.ign"
serializer = "serializer/mod.ign"
json = "json/mod.ign"
toml = "toml/mod.ign"
format = "format/mod.ign"
text = "text/mod.ign"
sync = "sync/mod.ign"
thread = "thread/mod.ign"
net = "net/mod.ign"
http = "http/mod.ign"
regex = "regex/mod.ign"
web = "web/mod.ign"
sqlite3 = "sqlite3/mod.ign"
orm = "orm/mod.ign"

[auto_load]
# `process_runtime` is here because the generated C entrypoint always calls
# `ignis_runtime_init`, so the module that defines it has to be in every program.
modules = ["string", "number", "vector", "types", "option", "result", "format", "process_runtime"]

[compile_only]
modules = ["compile"]

[linking.ignis_rt]
# Base type header. There is no runtime archive: the standard library is Ignis
# end to end and links out of `libignis_std.a`.
header = "runtime/ignis_rt.h"
header_quoted = true

[linking.libc]
# libc needs multiple C standard headers (libc itself is linked implicitly)
headers = [
  "stdlib.h",
  "string.h",
  "stdio.h",
  "errno.h",
  "ctype.h",
  "time.h",
  "signal.h",
  "unistd.h",
  "sys/mman.h",
  "sys/wait.h",
  "sys/stat.h",
  "dirent.h",
  "fcntl.h",
  "sys/ioctl.h",
]

[linking.math]
# Math module uses standard C math library
header = "math.h"
header_quoted = false
lib = "m"

[linking.sqlite3]
# SQLite binding. `pkgs.sqlite` (Nix dev shell) or `libsqlite3-dev` (Debian,
# Ubuntu) must be installed: build-std compiles every module in `[modules]`,
# so `sqlite3.h` is a prerequisite of building the compiler and std, not only
# of programs that import `std::sqlite3`.
header = "sqlite3.h"
header_quoted = false
lib = "sqlite3"
