[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["build"]

[workspace.dependencies]
serde = { version = "1.0.188", features = ["derive"] }
serde_json = "1.0.105"
toml = "1.0.0"
colored = "3.1.1"
ignis_config = { path = "crates/ignis_config" }
ignis_log = { path = "crates/ignis_log" }
ignis_token = { path = "crates/ignis_token" }
bitflags = "2.10.0"
ordered-float = "5.1.0"
insta = { version = "1.40", features = ["yaml"] }
proptest = "1.5"
tempfile = "3.14"

[workspace.package]
authors = ["Ignacio Perez <ignacio@feuer.me>"]
description = "The Ignis programming language"
keywords = ["programming", "language", "compiler"]
license = "GPL-3.0-only"
repository = "https://github.com/Ignis-lang/ignis"
version = "0.4.0"

# The selfhost gates in CI and the nightly bootstrap ladder run the compiler
# under test against its own source for tens of minutes. A plain debug build
# is too slow for that budget, but a plain `--release` silently drops
# `mono_output.verify_no_generics()` and every `debug_assert!` (both are
# `#[cfg(debug_assertions)]`), which those gates rely on to catch
# monomorphization and invariant bugs. This profile keeps release codegen
# speed while restoring debug assertions and overflow checks.
[profile.ci]
inherits = "release"
opt-level = 3
debug = 1
lto = false
debug-assertions = true
overflow-checks = true
