name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# A newer push to the same ref makes the in-flight run obsolete. The selfhost
# job takes tens of minutes, so letting superseded runs finish wastes most of
# the queue.
concurrency:
  group: ci-${{ github.ref }}
  # On a branch, a newer push makes the in-flight run obsolete and cancelling it
  # frees the queue. On `main` it does the opposite: the superseded commit is
  # already merged, so cancelling leaves it permanently unverified, and the
  # nightly release chained to this workflow never fires for it.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Pinned to the same nightly the development flake provides, so a green run
  # here means the same thing as a green run on a developer machine. An
  # unpinned channel already turned this workflow red on its first run over a
  # lint that did not exist in the local toolchain — the code had not changed.
  RUST_NIGHTLY: nightly-2026-04-22

jobs:
  rust:
    name: Rust gates
    runs-on: ubuntu-latest
    # The test step alone has crossed 25 minutes on a slow runner three times
    # in one day, cancelling green runs on branches that do not touch Rust.
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_NIGHTLY }}
          components: rustfmt, clippy

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v0-rust"
          shared-key: "ci-rust"
          cache-targets: true
          cache-on-failure: true

      # `.cargo/config.toml` selects mold for the Linux targets, so it has to be
      # present before any cargo invocation links.
      #
      # This used to be `apt-get update && apt-get install -y mold`, which hung for
      # 55 minutes on an unresponsive Ubuntu mirror and burned the job's budget before
      # a single crate compiled. The upstream release tarball is one request to a host
      # the workflow already depends on, and the version is pinned rather than being
      # whatever the distribution happens to carry.
      - name: Install mold
        timeout-minutes: 3
        env:
          MOLD_VERSION: 2.42.0
        run: |
          curl -fsSL --retry 3 --retry-delay 2 \
            "https://github.com/rui314/mold/releases/download/v${MOLD_VERSION}/mold-${MOLD_VERSION}-x86_64-linux.tar.gz" \
            | sudo tar -xz --strip-components=1 -C /usr/local
          mold --version

      - name: Check formatting
        run: cargo fmt --all --check

      # No clippy warning is acceptable in this workspace. Keeping this as a
      # gate is the only thing that stops them accumulating again.
      - name: Lint
        run: cargo clippy --all-targets --workspace --locked -- -D warnings

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # End-to-end and codegen tests compile generated C, so the runner's gcc is
      # part of the contract. nextest runs one process per test and reports every
      # failure, where `cargo test` stops at the first failing target — a run that
      # aborted after two of twenty-six targets looks green at a glance.
      - name: Test
        run: cargo nextest run --workspace --locked --no-fail-fast

      # nextest cannot run doctests, so they stay on the built-in harness.
      - name: Doctests
        run: cargo test --doc --workspace --locked

  selfhost:
    name: Selfhost gates
    runs-on: ubuntu-latest
    # These steps run the compiler under test against its own source, so a hang
    # introduced by the change being tested is a real outcome. Without a cap it
    # would hold a runner for six hours, and on a pull request anyone can
    # trigger that. The budget is roughly double the slowest observed run.
    #
    # The selfhost test suite once reached 23 minutes as the corpus grew (that
    # was before the test runner's job-pool commit, 29985c90); the whole job
    # measured 9m03s on run 34782190339 (`ignis test` itself: 7m24s).
    #
    # The stage1 steps below (added to close the PR #201/#202/#203 gap — a
    # selfhost-built binary was never exercised on a PR at all) add stage1's
    # own build plus one more selfhost-test-suite run under it, roughly
    # doubling the job; 90 keeps this job's "roughly double the slowest
    # observed run" convention against that ~45-minute expectation.
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Pure bash/python against fake compiler binaries, so it needs neither
      # Rust nor a built `ignis` — runs before either is set up. Covers
      # scripts/bootstrap.sh's stage0 fallback (build_stage1 rebuilding stage1
      # with the host compiler when an official/selfhost stage0 fails), which
      # nightly.yml's ladder otherwise only exercises when a published
      # selfhost binary actually goes stale, `ensure_stage`'s staleness stamps
      # (IGN-210: a gate must not silently report results for a stage binary
      # whose sources or stage0/host compiler changed since it was built),
      # plus bootstrap_report.py's promotion `candidate` verdict (G7's own
      # gate/report code path).
      - name: Test the bootstrap stage0 fallback, stage stamps and promotion report
        run: |
          scripts/tests/test_stage0_fallback.sh
          scripts/tests/test_stage_stamps.sh
          python3 scripts/tests/test_bootstrap_report.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_NIGHTLY }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v0-rust"
          # Suffixed with the profile: the job used to build target/debug and
          # now builds target/ci, and a shared key across two different target
          # subdirectories would only cost a one-time cache miss, but keeping
          # them apart avoids ever mixing the two.
          shared-key: "ci-selfhost-profile-ci"
          cache-targets: true
          cache-on-failure: true

      # `.cargo/config.toml` selects mold for the Linux targets, so it has to be
      # present before any cargo invocation links.
      #
      # This used to be `apt-get update && apt-get install -y mold`, which hung for
      # 55 minutes on an unresponsive Ubuntu mirror and burned the job's budget before
      # a single crate compiled. The upstream release tarball is one request to a host
      # the workflow already depends on, and the version is pinned rather than being
      # whatever the distribution happens to carry.
      - name: Install mold
        timeout-minutes: 3
        env:
          MOLD_VERSION: 2.42.0
        run: |
          curl -fsSL --retry 3 --retry-delay 2 \
            "https://github.com/rui314/mold/releases/download/v${MOLD_VERSION}/mold-${MOLD_VERSION}-x86_64-linux.tar.gz" \
            | sudo tar -xz --strip-components=1 -C /usr/local
          mold --version

      # Built with the `ci` profile rather than plain debug or `--release`: the
      # selfhost gates rely on `debug_assert!` and
      # `mono_output.verify_no_generics()`, which `--release` strips, while
      # plain debug is too slow for this job's budget.
      - name: Build Ignis
        run: cargo build --locked --profile ci -p ignis

      # `git diff` alone would miss a fixture the generator newly *creates*,
      # since an untracked file is not a diff. `git status --porcelain` with
      # untracked files listed catches added, removed and modified alike.
      - name: Check the ownership corpus generator is idempotent
        run: |
          python3 scripts/gen_ownership_corpus.py
          dirty="$(git status --porcelain --untracked-files=all -- test_cases/e2e/ok/ownership test_cases/e2e/err/ownership)"
          if [ -n "$dirty" ]; then
            echo "The ownership corpus is out of date; re-run scripts/gen_ownership_corpus.py and commit the result." >&2
            echo "$dirty" >&2
            exit 1
          fi

      - name: Add Ignis to PATH
        run: echo "${GITHUB_WORKSPACE}/target/ci" >> "$GITHUB_PATH"

      # `ignis fmt --check` exits non-zero listing every file that is not in
      # canonical layout. `example/add.ign` is excluded because it hits the
      # deferred `export inline` token-shape drift pinned by
      # `deferred_example_add_token_shape_drift_from_export_inline`.
      - name: Check Ignis formatting
        run: |
          mapfile -t sources < <(find std ignis example -name '*.ign' ! -path 'example/add.ign')
          ignis fmt --check "${sources[@]}"

      - name: Analyze the standard library and the selfhost compiler
        run: ignis check

      # Captured to a log rather than just run, so the G3-stage1 comparison
      # below can compare stage1's run against this exact host run instead of
      # paying for a second, byte-identical `<host> test` invocation.
      - name: Run the selfhost test suite
        run: |
          set -uo pipefail
          mkdir -p build/bootstrap/stage1-tests
          status=0
          timeout 10800 ignis test 2>&1 | tee build/bootstrap/stage1-tests/log-host.txt || status=${PIPESTATUS[0]}
          scripts/bootstrap.sh gate-g3-record-host stage1 "$status" build/bootstrap/stage1-tests/log-host.txt
          exit "$status"

      # The standard library owns the string runtime the C smoke test used to
      # cover, so its own suite is the gate for it.
      - name: Run the standard library test suite
        run: ignis test-std --std-path std

      # Everything above only ever runs the host (Rust) binary. PR #201 passed
      # this job untouched and still broke the nightly ladder: the selfhost
      # test suite failed to even link under a selfhost-built binary (G3), and
      # stage2 panicked on two error-corpus cases (G5) — neither surfaced
      # until the nightly ran hours later. stage1 (this binary compiling
      # `ignis/main.ign` once) is the cheapest selfhost binary that exercises
      # the same code paths, so PRs get it instead of stage2/stage3 or the
      # rest of the ladder (G1/G2/G4/G6/G7), which stay nightly-only.
      - name: Build stage1 with the host compiler
        env:
          IGNIS_STAGE0: ${{ github.workspace }}/target/ci/ignis
        run: scripts/bootstrap.sh stage1

      # The equivalent of the nightly's gate-g3-stage2/gate-g3-compare pair,
      # run against stage1 instead of stage2: the host half was already
      # recorded above by "Run the selfhost test suite", so this only runs
      # stage1's half of the suite and compares it against that recorded run.
      # Writes gates/G3-STAGE1.json.
      - name: Run the selfhost test suite under stage1 (G3, stage1)
        run: scripts/bootstrap.sh gate-g3-stage1

      - name: Check G3 (stage1 vs host)
        run: |
          set -euo pipefail

          gate_file="build/bootstrap/gates/G3-STAGE1.json"
          if [ ! -f "$gate_file" ]; then
            echo "no G3-STAGE1 gate result was produced" >&2
            exit 1
          fi

          status="$(jq -r '.status' "$gate_file")"
          summary="$(jq -r '.summary' "$gate_file")"
          echo "G3 (stage1 vs host): ${status} — ${summary}"

          if [ "$status" != "pass" ]; then
            echo "stage1's selfhost test summary differs from the host's; see ${gate_file}" >&2
            exit 1
          fi

      # The nightly's gate-g5, run against stage1 instead of stage2. Writes
      # gates/G5-STAGE1.json.
      - name: Replay the error corpus through stage1 (G5, stage1)
        run: scripts/bootstrap.sh gate-g5-stage1

      - name: Check G5 (stage1)
        run: |
          set -euo pipefail

          gate_file="build/bootstrap/gates/G5-STAGE1.json"
          if [ ! -f "$gate_file" ]; then
            echo "no G5-STAGE1 gate result was produced" >&2
            exit 1
          fi

          status="$(jq -r '.status' "$gate_file")"
          summary="$(jq -r '.summary' "$gate_file")"
          echo "G5 (stage1): ${status} — ${summary}"

          if [ "$status" != "pass" ]; then
            echo "stage1 does not keep every diagnostic the host records; see ${gate_file}" >&2
            exit 1
          fi

      # `failure()` alone misses a run cancelled by `timeout-minutes` expiring
      # (the job is cancelled, not failed), which is exactly the case these
      # artifacts would be most useful for diagnosing.
      - name: Upload stage1 selfhost gate artifacts
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: stage1-selfhost-gates
          path: |
            build/bootstrap/stage1/log.txt
            build/bootstrap/gates/G3-STAGE1.json
            build/bootstrap/gates/G5-STAGE1.json
            build/bootstrap/stage1-tests/log*.txt
            build/bootstrap/stage1-tests/status-*.json
            build/bootstrap/parity-err-stage1.md
            build/bootstrap/parity-err-stage1.json
          if-no-files-found: ignore

  # The two-step rule: a language change may only be USED in ignis/ or std/
  # after compiler support for it has been promoted to the official selfhost
  # binary. Today `scripts/bootstrap.sh`'s stage1 falls back from a failing
  # official stage0 to the host compiler (build_stage1_with_host), so a PR
  # that lands a language feature together with its first use in the
  # compiler's own sources still passes `selfhost` above — the host always
  # builds it — and the violation only surfaces on the nightly ladder, hours
  # later, against the still-unpromoted official binary. See BOOTSTRAP.md.
  #
  # This job reproduces exactly that one check on the PR itself: resolve the
  # current official asset (scripts/resolve_official_stage0.sh, the same
  # logic nightly.yml's "Resolve stage0" step runs) and build stage1 with it
  # alone, fallback disabled. It needs no Rust toolchain: the official binary
  # already exists, and linking its output only needs the runner's gcc.
  #
  # A fresh fork or a repository whose promotion streak has not yet reached 3
  # has no official asset to check against — that is not a violation, it is
  # "nothing to check yet", so the job skips rather than fails (job summary
  # notice, exit 0). Parallel to `rust` and `selfhost` so it does not lengthen
  # the critical path.
  official-stage0-gate:
    name: Official stage0 gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Exits 2 (not 0) on the skip path (no official asset to check against
      # yet), which would otherwise fail this step and skip every step below
      # it; continue-on-error keeps the job going so the next step can read
      # `steps.stage0.outputs.resolved` and turn that into a notice.
      - name: Resolve the official stage0 asset
        id: stage0
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STAGE0_MODE: official
          STAGE0_UNAVAILABLE_ACTION: skip
        run: scripts/resolve_official_stage0.sh

      - name: No official asset to check yet
        if: steps.stage0.outputs.resolved != 'true'
        run: echo "::notice::No official selfhost asset is published yet (fresh fork, or the promotion streak has not reached 3); skipping the two-step rule gate."

      # `id: build` plus `continue-on-error` so the next step can turn a
      # failure into a warning when the override label is present, instead of
      # the job stopping here.
      - name: Build stage1 with the official compiler (fallback disabled)
        id: build
        if: steps.stage0.outputs.resolved == 'true'
        continue-on-error: true
        env:
          IGNIS_STAGE0_NO_FALLBACK: "1"
        run: scripts/bootstrap.sh stage1

      # `stage0-break-approved` exists for the one case the two-step rule
      # cannot itself tell apart from an ordinary violation: a bug fix the
      # official binary genuinely cannot express (e.g. the fix's own
      # correctness depends on a compiler change that has not promoted yet).
      # Labels only exist on `pull_request` events; a push to `main` carries
      # none, so this always enforces there.
      - name: Enforce the two-step rule
        if: steps.stage0.outputs.resolved == 'true' && steps.build.outcome != 'success'
        env:
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail

          if echo "$LABELS_JSON" | jq -e 'index("stage0-break-approved") != null' >/dev/null 2>&1; then
            echo "::warning::stage1 failed to build with the official stage0 compiler (two-step rule), but the 'stage0-break-approved' label overrides this to a warning. See build/bootstrap/stage1/log.txt."
            exit 0
          fi

          echo "::error::stage1 failed to build with the official stage0 compiler. A language change may only be used in ignis/ or std/ after compiler support for it has been promoted to the official binary. Split this PR (land the compiler support, wait for it to promote, then use the feature), or, only if this is a bug fix the official binary genuinely cannot express, apply the 'stage0-break-approved' label."
          exit 1

      - name: Upload the stage1 log
        if: always() && steps.stage0.outputs.resolved == 'true' && steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: official-stage0-gate-log
          path: build/bootstrap/stage1/log*.txt
          if-no-files-found: ignore
