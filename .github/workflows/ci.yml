name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# A newer push to the same ref makes the in-flight run obsolete. The selfhost
# job takes tens of minutes, so letting superseded runs finish wastes most of
# the queue.
concurrency:
  group: ci-${{ github.ref }}
  # On a branch, a newer push makes the in-flight run obsolete and cancelling it
  # frees the queue. On `main` it does the opposite: the superseded commit is
  # already merged, so cancelling leaves it permanently unverified, and the
  # nightly release chained to this workflow never fires for it.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  selfhost:
    name: Selfhost gates
    runs-on: ubuntu-latest
    # These steps run the compiler under test against its own source, so a hang
    # introduced by the change being tested is a real outcome. Without a cap it
    # would hold a runner for six hours, and on a pull request anyone can
    # trigger that. The budget is roughly double the slowest observed run.
    #
    # The selfhost test suite once reached 23 minutes as the corpus grew (that
    # was before the test runner's job-pool commit, 29985c90); the whole job
    # measured 9m03s on run 34782190339 (`ignis test` itself: 7m24s).
    #
    # The stage1 steps below (added to close the PR #201/#202/#203 gap — a
    # selfhost-built binary was never exercised on a PR at all) add stage1's
    # own build plus one more selfhost-test-suite run under it, roughly
    # doubling the job; 90 keeps this job's "roughly double the slowest
    # observed run" convention against that ~45-minute expectation. Dropping
    # the Rust build and the host's own suite run since then shortens the job,
    # but no run without them has been measured yet, so the budget stays.
    timeout-minutes: 90

    steps:
      # Full history: the baseline churn report below diffs against the merge
      # base with the pull request's base branch, and the default shallow
      # checkout has neither that branch nor a common ancestor to find.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pure bash/python against fake compiler binaries, so it needs no built
      # `ignis` and runs before stage1 is built. Covers how
      # scripts/bootstrap.sh and scripts/resolve_official_stage0.sh pick
      # stage0 (the official binary or the C seed, never the host, and a
      # stage0 that cannot build stage1 is terminal), `ensure_stage`'s
      # staleness stamps (IGN-210: a gate must not silently report results
      # for a stage binary whose sources or stage0 changed since it was
      # built), plus bootstrap_report.py's promotion `candidate` verdict
      # (G7's own gate/report code path).
      - name: Test the bootstrap stage0 selection, stage stamps and promotion report
        run: |
          scripts/tests/test_stage0.sh
          scripts/tests/test_stage_stamps.sh
          scripts/tests/test_build_from_seed.sh
          scripts/tests/test_baseline_churn_report.sh
          python3 scripts/tests/test_bootstrap_report.py
          python3 scripts/tests/test_selfhost_syntax_parity.py
          python3 scripts/tests/test_selfhost_doc_parity.py
          python3 scripts/tests/test_check_platform_constants.py

      # `git diff` alone would miss a fixture the generator newly *creates*,
      # since an untracked file is not a diff. `git status --porcelain` with
      # untracked files listed catches added, removed and modified alike.
      # The generator also prunes the G7 drop-schedule and G6 parse-verdict
      # baselines of ownership fixtures it no longer produces, so the dirty-tree
      # check covers those directories too: a retired case must not leave a
      # baseline behind.
      - name: Check the ownership corpus generator is idempotent
        run: |
          python3 scripts/gen_ownership_corpus.py
          dirty="$(git status --porcelain --untracked-files=all -- test_cases/e2e/ok/ownership test_cases/e2e/err/ownership test_cases/e2e/ok/__drop_schedules__ test_cases/__parse_verdicts__)"
          if [ -n "$dirty" ]; then
            echo "The ownership corpus is out of date; re-run scripts/gen_ownership_corpus.py and commit the result." >&2
            echo "$dirty" >&2
            exit 1
          fi

      # A fixture added without its drop-schedule baseline, or a baseline left
      # behind by a retired fixture, fails G7 — but G7 needs a selfhost binary
      # and several minutes. This runs no compiler and takes under a second,
      # so the common mistake is reported here rather than 40 minutes later.
      # The committed C seed (bootstrap/seed) is what rebuilds the compiler
      # once the Rust host is gone, so a seed whose archive no longer matches
      # its manifest is caught here rather than on the night it is needed.
      # Checks the manifest's shape and both checksums; compiles nothing.
      - name: Check the C seed matches its manifest
        run: scripts/build_from_seed.sh --verify-only

      # std/libc/platform.ign writes the x86_64 Linux value of every C platform
      # constant std uses, so backends other than C never need a header. This
      # compiles each name against the real headers and fails on any mismatch.
      - name: Check the platform constants against the C headers
        run: python3 scripts/check_platform_constants.py

      - name: Check every e2e fixture has a drop-schedule baseline
        run: python3 scripts/selfhost_drop_schedule_parity.py --check-coverage

      # The same check for G6, whose corpus is every `.ign` file under
      # test_cases/, example/ and std/: each needs a well-formed parse-verdict
      # baseline, no baseline may outlive its case, and no two sources may
      # flatten to one case name. G6 itself stays nightly-only (every case is a
      # full compile and link), so without this a new case would first fail
      # there.
      - name: Check every G6 case has a parse-verdict baseline
        run: python3 scripts/selfhost_syntax_parity.py --check-coverage

      # Regenerating the baselines is one command, which makes it the easy way
      # to turn a red gate green, and nobody reads 700 generated files in a
      # diff. This puts the churn in the job summary, where the reviewer sees
      # it. `.github/CODEOWNERS` is the other half, once branch protection
      # requires code-owner review.
      - name: Report baseline churn
        if: github.event_name == 'pull_request'
        run: |
          scripts/baseline_churn_report.sh \
            "origin/${{ github.base_ref }}" \
            test_cases/e2e/ok/__drop_schedules__ \
            test_cases/__parse_verdicts__ \
            test_cases/parser/host_unit_tests \
            test_cases/doc/__doc_baselines__

      # Every step from here runs stage1: stage0 is built from the committed C
      # seed with gcc alone, and compiles `ignis/main.ign` once. This job never
      # depends on the Rust host. Stage construction needs no network download;
      # QBE test-tool provisioning below does. The official binary
      # gets its own check in `official-stage0-gate` below. stage1 is the
      # cheapest selfhost binary that exercises the compiler under test, so
      # PRs get it instead of stage2/stage3 or the rest of the ladder
      # (G1/G2/G4/G6), which stay nightly-only. PR #201 is why this matters:
      # it passed a job that only ran the host binary and still broke the
      # nightly ladder (the selfhost test suite failed to link under a
      # selfhost-built binary, G3, and stage2 panicked on two error-corpus
      # cases, G5). G7 needs no stage2, so stage1 answers it in about two
      # minutes. G6's cases are each a full compile and link, so only its
      # compiler-free coverage check runs on PRs (above).
      - name: Build stage1 from the C seed
        run: scripts/bootstrap.sh stage1-from-seed

      - name: Add stage1 to PATH
        run: echo "${GITHUB_WORKSPACE}/build/bootstrap/stage1" >> "$GITHUB_PATH"

      # `ignis fmt --check` exits non-zero listing every file that is not in
      # canonical layout.
      - name: Check Ignis formatting
        run: |
          mapfile -t sources < <(find std ignis example -name '*.ign')
          ignis fmt --check "${sources[@]}"

      - name: Analyze the standard library and the selfhost compiler
        run: ignis check

      # `ignis doc` publishes the API package the release ships, so stage1's
      # has to match the committed baselines byte for byte on the release
      # target and the former doc_command.rs programs.
      - name: Compare stage1's ignis doc output with the committed baselines
        run: python3 scripts/selfhost_doc_parity.py --compiler build/bootstrap/stage1/ignis

      # The standard library owns the string runtime the C smoke test used to
      # cover, so its own suite is the gate for it.
      - name: Run the standard library test suite under stage1
        run: build/bootstrap/stage1/ignis test-std --std-path std

      # `ignis lsp` has no host oracle to diff against, so it is driven the
      # way an editor drives it: lifecycle, error responses and the
      # diagnostics published for an open buffer. It lives here rather than
      # with the other scripts/tests steps because it needs a selfhost binary.
      - name: Drive the selfhost language server over stdio (stage1)
        env:
          IGNIS_LSP_COMPILER: build/bootstrap/stage1/ignis
        run: python3 scripts/tests/test_selfhost_lsp.py -v

      - name: Install QBE 1.2 for executable backend tests
        run: |
          curl -fsSL https://c9x.me/compile/release/qbe-1.2.tar.xz -o "$RUNNER_TEMP/qbe-1.2.tar.xz"
          echo "a6d50eb952525a234bf76ba151861f73b7a382ac952d985f2b9af1df5368225d  $RUNNER_TEMP/qbe-1.2.tar.xz" | sha256sum --check
          tar -C "$RUNNER_TEMP" -xf "$RUNNER_TEMP/qbe-1.2.tar.xz"
          make -C "$RUNNER_TEMP/qbe-1.2"
          echo "$RUNNER_TEMP/qbe-1.2" >> "$GITHUB_PATH"

      # The nightly's G3, run against stage1 instead of stage2: the suite has
      # to pass outright under stage1. This is the job's only run of the
      # selfhost test suite (the project's `ignis test`, fixtures included).
      # Writes gates/G3-STAGE1.json.
      - name: Run the selfhost test suite under stage1 (G3, stage1)
        run: scripts/bootstrap.sh gate-g3-stage1

      - name: Check G3 (stage1)
        run: |
          set -euo pipefail

          gate_file="build/bootstrap/gates/G3-STAGE1.json"
          if [ ! -f "$gate_file" ]; then
            echo "no G3-STAGE1 gate result was produced" >&2
            exit 1
          fi

          status="$(jq -r '.status' "$gate_file")"
          summary="$(jq -r '.summary' "$gate_file")"
          echo "G3 (stage1): ${status} — ${summary}"

          if [ "$status" != "pass" ]; then
            echo "the selfhost test suite did not pass under stage1; see ${gate_file}" >&2
            exit 1
          fi

      # The nightly's gate-g5, run against stage1 instead of stage2. Writes
      # gates/G5-STAGE1.json.
      - name: Replay the error corpus through stage1 (G5, stage1)
        run: scripts/bootstrap.sh gate-g5-stage1

      - name: Check G5 (stage1)
        run: |
          set -euo pipefail

          gate_file="build/bootstrap/gates/G5-STAGE1.json"
          if [ ! -f "$gate_file" ]; then
            echo "no G5-STAGE1 gate result was produced" >&2
            exit 1
          fi

          status="$(jq -r '.status' "$gate_file")"
          summary="$(jq -r '.summary' "$gate_file")"
          echo "G5 (stage1): ${status} — ${summary}"

          if [ "$status" != "pass" ]; then
            echo "stage1 does not keep every diagnostic the error corpus records; see ${gate_file}" >&2
            exit 1
          fi

      # The nightly's gate-g7, run against stage1 instead of stage2 and
      # without the `--project .` case (stage1 is that case's reference, and a
      # second self-compilation is not worth a PR's runner minutes). Writes
      # gates/G7-STAGE1.json. Measured at ~2 minutes on this runner.
      - name: Check stage1's drop schedules against the baselines (G7, stage1)
        run: scripts/bootstrap.sh gate-g7-stage1

      - name: Check G7 (stage1)
        run: |
          set -euo pipefail

          gate_file="build/bootstrap/gates/G7-STAGE1.json"
          if [ ! -f "$gate_file" ]; then
            echo "no G7-STAGE1 gate result was produced" >&2
            exit 1
          fi

          status="$(jq -r '.status' "$gate_file")"
          summary="$(jq -r '.summary' "$gate_file")"
          echo "G7 (stage1): ${status} — ${summary}"

          if [ "$status" != "pass" ]; then
            echo "stage1's drop schedules differ from the committed baselines; see ${gate_file}" >&2
            exit 1
          fi

      # `failure()` alone misses a run cancelled by `timeout-minutes` expiring
      # (the job is cancelled, not failed), which is exactly the case these
      # artifacts would be most useful for diagnosing.
      - name: Upload stage1 selfhost gate artifacts
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: stage1-selfhost-gates
          path: |
            build/bootstrap/stage1/log.txt
            build/bootstrap/gates/G3-STAGE1.json
            build/bootstrap/gates/G5-STAGE1.json
            build/bootstrap/gates/G7-STAGE1.json
            build/bootstrap/parity-drops-stage1.md
            build/bootstrap/parity-drops-stage1.json
            build/bootstrap/stage1-tests/log*.txt
            build/bootstrap/stage1-tests/status-*.json
            build/bootstrap/parity-err-stage1.md
            build/bootstrap/parity-err-stage1.json
          if-no-files-found: ignore

  # The two-step rule: a language change may only be USED in ignis/ or std/
  # after compiler support for it has been promoted to the official selfhost
  # binary. `selfhost` above builds stage1 from the C seed, so a PR that lands
  # a language feature together with its first use in the compiler's own
  # sources can pass it while the official binary, which the nightly ladder
  # starts from, cannot build that stage1. See BOOTSTRAP.md.
  #
  # This job reproduces exactly that one check on the PR itself: resolve the
  # current official asset (scripts/resolve_official_stage0.sh, the same
  # logic nightly.yml's "Resolve stage0" step runs) and build stage1 with it.
  # A failing official stage0 is terminal in scripts/bootstrap.sh, and its
  # message names the two-step rule. The official binary already exists, and
  # linking its output only needs the runner's gcc.
  #
  # A fresh fork or a repository whose promotion streak has not yet reached 3
  # has no official asset to check against — that is not a violation, it is
  # "nothing to check yet", so the job skips rather than fails (job summary
  # notice, exit 0). Parallel to `selfhost` so it does not lengthen
  # the critical path.
  official-stage0-gate:
    name: Official stage0 gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Exits 2 (not 0) on the skip path (no official asset to check against
      # yet), which would otherwise fail this step and skip every step below
      # it; continue-on-error keeps the job going so the next step can read
      # `steps.stage0.outputs.resolved` and turn that into a notice.
      - name: Resolve the official stage0 asset
        id: stage0
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STAGE0_MODE: official
          STAGE0_UNAVAILABLE_ACTION: skip
        run: scripts/resolve_official_stage0.sh

      # scripts/resolve_official_stage0.sh always sets `resolved` (true or
      # false) on every intentional outcome, including the skip path — an
      # empty output means the step failed before reaching that point (a gh
      # outage, a missing jq, a token problem, a future bug in the script),
      # which continue-on-error above would otherwise make indistinguishable
      # from "no official asset published" and let the job pass green.
      - name: Fail on an unexpected stage0 resolution error
        if: steps.stage0.outputs.resolved == ''
        run: |
          echo "::error::stage0 resolution failed unexpectedly — see the 'Resolve the official stage0 asset' step's log. This is not the same as no official asset being published (that case sets resolved=false and skips)."
          exit 1

      - name: No official asset to check yet
        if: steps.stage0.outputs.resolved == 'false'
        run: echo "::notice::No official selfhost asset is published yet (fresh fork, or the promotion streak has not reached 3); skipping the two-step rule gate."

      # `id: build` plus `continue-on-error` so the next step can turn a
      # failure into a warning when the override label is present, instead of
      # the job stopping here.
      # stage1 must also compile stage2: a stage1 that builds but miscompiles
      # the compiler (the official binary lacking a fix the sources now rely
      # on) only shows up when it runs. #264 passed the stage1-only gate and
      # broke the nightly exactly that way.
      - name: Build stage1 with the official compiler, then stage2 with it
        id: build
        if: steps.stage0.outputs.resolved == 'true'
        continue-on-error: true
        run: |
          scripts/bootstrap.sh stage1
          scripts/bootstrap.sh stage2

      # `stage0-break-approved` exists for the one case the two-step rule
      # cannot itself tell apart from an ordinary violation: a bug fix the
      # official binary genuinely cannot express (e.g. the fix's own
      # correctness depends on a compiler change that has not promoted yet).
      # Labels only exist on `pull_request` events; a push to `main` carries
      # none, so this always enforces there.
      - name: Enforce the two-step rule
        if: steps.stage0.outputs.resolved == 'true' && steps.build.outcome != 'success'
        env:
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail

          MESSAGE="stage1 did not build with the official stage0 compiler, or that stage1 could not compile stage2. If the uploaded log (official-stage0-gate-log) shows a compiler diagnostic, this is a two-step rule violation: a language change may only be used in ignis/ or std/ after compiler support for it has been promoted to the official binary. Split this PR (land the compiler support, wait for it to promote, then use the feature), or, only if this is a bug fix the official binary genuinely cannot express, apply the 'stage0-break-approved' label. If the log instead shows a build/link/environment failure unrelated to a compiler diagnostic, that is a gate problem, not a two-step rule violation — please report it."

          if echo "$LABELS_JSON" | jq -e 'index("stage0-break-approved") != null' >/dev/null 2>&1; then
            echo "::warning::${MESSAGE} The 'stage0-break-approved' label is present, so this is a warning, not a failure."
            exit 0
          fi

          echo "::error::${MESSAGE}"
          exit 1

      - name: Upload the stage1 log
        if: always() && steps.stage0.outputs.resolved == 'true' && steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: official-stage0-gate-log
          path: |
            build/bootstrap/stage1/log*.txt
            build/bootstrap/stage2/log*.txt
          if-no-files-found: ignore
