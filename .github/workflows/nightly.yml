name: Nightly

# Chained to CI rather than triggered by the push directly. Both would fire on
# the same commit, and re-running the gates here would repeat a selfhost job
# that already takes the better part of an hour. Waiting for the CI run also
# means a nightly asset only ever comes from a commit that passed every gate.
on:
  workflow_run:
    workflows: ["CI"]
    branches:
      - main
    types:
      - completed
  workflow_dispatch:
    inputs:
      stage0:
        description: "Which compiler builds stage1"
        type: choice
        default: auto
        options:
          - auto
          - host
          - official

# Unlike CI, an in-flight nightly is left to finish. The run force-moves a tag
# and rewrites one release's assets, so two runs racing on the same rolling
# release can interleave a delete from one with an upload from the other.
concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Kept in step with the flake and with ci.yml. A floating channel makes a red
  # run here mean something different from a red run on a developer machine.
  RUST_NIGHTLY: nightly-2026-04-22

jobs:
  release:
    name: Publish rolling nightly
    # A failed or cancelled CI run publishes nothing. `workflow_dispatch` has no
    # originating run, so it is allowed through on its own.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # `workflow_run` starts from the default branch, which may already have
          # moved on. Build the commit CI actually verified.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_NIGHTLY }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: nightly-linux-amd64
          cache-targets: true
          cache-on-failure: true

      # `.cargo/config.toml` selects mold for the Linux targets, so it has to be
      # present before any cargo invocation links.
      - name: Install mold
        run: |
          sudo apt-get update
          sudo apt-get install -y mold

      - name: Build the C runtime archive
        run: make -C std/runtime

      - name: Build Ignis
        run: cargo build --release --locked -p ignis

      - name: Create package
        run: |
          mkdir -p pkg/scripts

          cp target/release/ignis pkg/ignis
          chmod +x pkg/ignis

          cp -r std pkg/std
          cp scripts/install.sh pkg/scripts/
          cp scripts/uninstall.sh pkg/scripts/
          cp scripts/PKGBUILD pkg/scripts/
          chmod +x pkg/scripts/install.sh pkg/scripts/uninstall.sh

      - name: Create tar archive
        run: tar -czf ignis-nightly-linux-amd64.tar.gz -C pkg .

      - name: Generate checksum
        run: sha256sum ignis-nightly-linux-amd64.tar.gz > ignis-nightly-linux-amd64.tar.gz.sha256

      # The nightly carries documentation for the same reason a release does, and it
      # is the only bundle that exists until the next release: without it the website
      # has guides but no API reference for anything.
      - name: Build documentation bundle
        run: |
          mkdir -p docs-pkg

          cp -r docs/web docs-pkg/guides

          # The standard library has no root module. Any std entry makes the driver
          # discover every module in the manifest, so documenting one documents all.
          ./target/release/ignis doc std/io/mod.ign --std-path std --output docs-pkg/api.json

      - name: Create documentation archive
        run: tar -czf ignis-docs.tar.gz -C docs-pkg .

      - name: Generate documentation checksum
        run: sha256sum ignis-docs.tar.gz > ignis-docs.tar.gz.sha256

      - name: Compose release body
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          DATE=$(date -u '+%Y-%m-%d')
          cat > release_body.md <<EOF
          > **Nightly build** — produced from \`main\` on every green CI run.
          > Assets are replaced on each run, so a download is only reproducible
          > against the commit named below.
          >
          > Commit: \`${SHORT_SHA}\` — ${DATE}
          EOF

      - name: Move the nightly tag to this commit
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git tag -f nightly HEAD
          git push origin nightly --force

      - name: Prune the previous nightly assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # The release is reused rather than deleted, so its old assets have to
          # go explicitly or they accumulate under names that no longer match the
          # commit. A missing release is the first run, not an error.
          #
          # Only this job's own assets are pruned. The bootstrap job keeps the
          # promotion streak and the last promoted selfhost binary on the same
          # release, and those must survive a run that is not a candidate.
          RELEASE_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/nightly" 2>/dev/null || true)
          if [ -z "$RELEASE_JSON" ]; then
            echo "No nightly release yet; nothing to prune."
            exit 0
          fi

          ASSET_IDS=$(jq -r '.assets[]? | select(.name | test("^(ignis-nightly-linux-amd64\\.tar\\.gz(\\.sha256)?|ignis-docs\\.tar\\.gz(\\.sha256)?)$")) | .id' <<<"$RELEASE_JSON")
          if [ -z "$ASSET_IDS" ]; then
            echo "Nightly release has no assets to prune."
            exit 0
          fi

          while IFS= read -r ASSET_ID; do
            [ -n "$ASSET_ID" ] || continue
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}"
          done <<<"$ASSET_IDS"

      - name: Publish
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: nightly
          name: Ignis Nightly
          body_path: release_body.md
          prerelease: true
          files: |
            ignis-nightly-linux-amd64.tar.gz
            ignis-nightly-linux-amd64.tar.gz.sha256
            ignis-docs.tar.gz
            ignis-docs.tar.gz.sha256

      # The website reads the guides from this release's `ignis-docs.tar.gz`, so a
      # documentation change is only live once the site is rebuilt against the new
      # asset. Nothing else connects the two repositories: without this the site
      # keeps serving whatever bundle existed at its last build.
      #
      # Runs only after Publish succeeded, so a failed upload never triggers a
      # build against a stale bundle. The hook URL is the credential, which is why
      # it is a secret and never echoed.
      - name: Trigger the website build
        if: success()
        env:
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_WEBHOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "CLOUDFLARE_WEBHOOK is not set; skipping the website build."
            exit 0
          fi

          STATUS=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$DEPLOY_HOOK")

          if [ "$STATUS" != "200" ]; then
            echo "Deploy hook returned HTTP $STATUS."
            exit 1
          fi

          echo "Website build triggered."

  # The bootstrap ladder is the selfhost fixed-point gate: stage2 (built by the
  # host-built compiler) and stage3 (built by stage2) must emit the same C.
  # Each self-compilation takes around fifteen minutes locally, so it runs here
  # once per green commit instead of on every pull request.
  #
  # Shape
  # -----
  # The ladder is built once in `stages` and published as one artifact; the gates
  # that only read stage2 then run as a matrix against that artifact, so the wall
  # time is the slowest gate rather than their sum. G3 is two full runs of the
  # selfhost test suite, one under stage2 and one under the host, so it takes a
  # matrix entry per run and `report` compares the collected logs. G4 stays with
  # the ladder because it compares two measurements, which only means something
  # when both were taken on the same machine. `report` collects the gate files
  # and decides the verdict. `scripts/bootstrap.sh gates` still runs the same
  # steps serially on a developer machine.
  #
  # Promotion flow
  # --------------
  # Every gate writes build/bootstrap/gates/<gate>.json, and
  # `scripts/bootstrap.sh report` turns those into build/bootstrap/promotion.json.
  # A run is a *candidate* when every gate passes; the `report` job's own red or
  # green is that verdict, decided after the artifacts are uploaded so a failing
  # run is still readable.
  #
  # The streak of consecutive candidate runs lives in the `promotion-streak.json`
  # asset of the rolling nightly release: it is read and written back by `report`.
  # At three consecutive candidates the stage2 binary is published as
  # `ignis-selfhost-linux-amd64`, and the streak keeps counting. A run that is
  # not a candidate resets the streak to zero and uploads no selfhost binary,
  # which leaves the last published one in place.
  #
  # Supersede
  # ---------
  # The ladder holds the `nightly` concurrency group for as long as it runs, so a
  # run whose commit `main` has already moved past keeps the run for the current
  # head queued behind a verdict nobody will use. `stages` polls the remote head
  # while it works and every later job checks it once, and a moved head ends the
  # run early as superseded rather than as a failure. A superseded run never
  # touches the streak.
  stages:
    name: Bootstrap ladder
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    outputs:
      superseded: ${{ steps.stages.outputs.superseded }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_NIGHTLY }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v0-rust"
          # Suffixed with the profile, matching ci.yml's selfhost job: the
          # target subdirectory moved from target/debug to target/ci.
          shared-key: "ci-selfhost-profile-ci"
          cache-targets: true
          cache-on-failure: true

      # Same pinned tarball as ci.yml: the distribution package hung on an
      # unresponsive mirror once and burned the whole budget.
      - name: Install mold
        timeout-minutes: 3
        env:
          MOLD_VERSION: 2.42.0
        run: |
          curl -fsSL --retry 3 --retry-delay 2 \
            "https://github.com/rui314/mold/releases/download/v${MOLD_VERSION}/mold-${MOLD_VERSION}-x86_64-linux.tar.gz" \
            | sudo tar -xz --strip-components=1 -C /usr/local
          mold --version

      - name: Build the C runtime archive
        run: make -C std/runtime

      # Built with the `ci` profile: the gates below rely on `debug_assert!`
      # and `mono_output.verify_no_generics()`, which `--release` strips, while
      # plain debug is too slow for the ladder's budget.
      - name: Build Ignis
        run: cargo build --locked --profile ci -p ignis

      - name: Add Ignis to PATH
        run: echo "${GITHUB_WORKSPACE}/target/ci" >> "$GITHUB_PATH"

      # Once a selfhost binary has been promoted `official`, the ladder starts
      # stage1 from it instead of the Rust host, so the ladder measures the
      # selfhost lineage compiling itself rather than the host compiling it
      # once more. The host stays the oracle for G3-host, G5, G6 and parity
      # regardless of which binary builds stage1.
      #
      # `promotion-streak.json` is the only record of whether the asset
      # currently on the release is still official: a later non-candidate run
      # resets its streak to zero without removing the asset, so the streak is
      # read fresh rather than assumed from the asset's mere presence.
      - name: Resolve stage0
        id: stage0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STAGE0_MODE: ${{ inputs.stage0 || 'auto' }}
        run: |
          set -uo pipefail

          mkdir -p build/bootstrap
          STAGE0_JSON="build/bootstrap/stage0.json"

          write_host_stage0() {
            printf '{"kind": "host", "source": "target/ci/ignis", "sha256": ""}\n' >"$STAGE0_JSON"
          }

          if [ "$STAGE0_MODE" = "host" ]; then
            echo "stage0: host forced by workflow_dispatch input"
            write_host_stage0
            exit 0
          fi

          # `official` fails the step outright on any problem, since it exists
          # to let a maintainer force and inspect that path; `auto` falls back
          # to the host and leaves IGNIS_STAGE0 unset instead.
          fall_back_or_fail() {
            echo "stage0: $1"

            if [ "$STAGE0_MODE" = "official" ]; then
              echo "stage0: official was forced by workflow_dispatch input but is unavailable"
              exit 1
            fi

            echo "stage0: falling back to the host compiler"
            write_host_stage0
            exit 0
          }

          WORKDIR="${RUNNER_TEMP}/stage0"
          mkdir -p "$WORKDIR"

          if ! gh release download nightly \
            --pattern 'ignis-selfhost-linux-amd64' \
            --pattern 'ignis-selfhost-linux-amd64.sha256' \
            --pattern 'promotion-streak.json' \
            --dir "$WORKDIR"; then
            fall_back_or_fail "the official selfhost asset is not on the nightly release"
          fi

          if [ ! -f "$WORKDIR/ignis-selfhost-linux-amd64" ] || [ ! -f "$WORKDIR/ignis-selfhost-linux-amd64.sha256" ]; then
            fall_back_or_fail "the official selfhost asset or its checksum is missing"
          fi

          if ! (cd "$WORKDIR" && sha256sum -c ignis-selfhost-linux-amd64.sha256); then
            fall_back_or_fail "the official selfhost asset failed checksum verification"
          fi

          if [ ! -f "$WORKDIR/promotion-streak.json" ]; then
            fall_back_or_fail "promotion-streak.json is missing; cannot confirm the asset is official"
          fi

          STREAK=$(jq -r '.streak // 0' "$WORKDIR/promotion-streak.json")

          if [ "$STREAK" -lt 3 ]; then
            fall_back_or_fail "the promotion streak is ${STREAK}, below the official threshold of 3"
          fi

          chmod +x "$WORKDIR/ignis-selfhost-linux-amd64"
          SHA256=$(cut -d' ' -f1 "$WORKDIR/ignis-selfhost-linux-amd64.sha256")

          echo "IGNIS_STAGE0=${WORKDIR}/ignis-selfhost-linux-amd64" >>"$GITHUB_ENV"

          jq -n --arg source "${WORKDIR}/ignis-selfhost-linux-amd64" --arg sha256 "$SHA256" \
            '{kind: "official", source: $source, sha256: $sha256}' >"$STAGE0_JSON"

          echo "stage0: official (sha ${SHA256})"

      # stage1 and stage2 have to succeed because every gate runs against
      # stage2's binary. G4 belongs to this job because its two measurements
      # only compare when they come from one machine. A G4 or stage3 failure is
      # that gate's verdict and is left to the report, so it does not keep the
      # rest of the gates from running.
      #
      # The ladder runs in its own process group while the remote head is
      # polled, so a moved head can end it early.
      - name: Build the bootstrap stages
        id: stages
        env:
          BUILT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          POLL_INTERVAL_SECONDS: 300
        run: |
          set -uo pipefail

          PGID_FILE="${RUNNER_TEMP}/bootstrap-stages.pgid"
          rm -f "$PGID_FILE"

          # shellcheck disable=SC2016 # $$ is the wrapper's own pid, expanded by it.
          setsid --wait bash -c 'echo $$ > "$1"; exec scripts/bootstrap.sh stages' _ "$PGID_FILE" &
          STAGES_WAITER=$!

          STAGES_PGID=""
          for _ in $(seq 1 10); do
            if [ -s "$PGID_FILE" ]; then
              STAGES_PGID=$(cat "$PGID_FILE")
              break
            fi
            sleep 1
          done

          remote_head() {
            git ls-remote --exit-code --heads origin refs/heads/main | awk '{print $1}'
          }

          SUPERSEDED_BY=""
          ELAPSED=0

          while kill -0 "$STAGES_WAITER" 2>/dev/null; do
            sleep 10
            ELAPSED=$((ELAPSED + 10))

            [ "$ELAPSED" -ge "$POLL_INTERVAL_SECONDS" ] || continue
            ELAPSED=0

            # An unreachable remote is not evidence that the head moved.
            REMOTE_HEAD=$(remote_head) || continue
            [ -n "$REMOTE_HEAD" ] || continue

            if [ "$REMOTE_HEAD" != "$BUILT_SHA" ]; then
              SUPERSEDED_BY="$REMOTE_HEAD"
              break
            fi
          done

          if [ -n "$SUPERSEDED_BY" ]; then
            if [ -n "$STAGES_PGID" ]; then
              kill -TERM "-${STAGES_PGID}" 2>/dev/null || true
              sleep 10
              kill -KILL "-${STAGES_PGID}" 2>/dev/null || true
            fi

            wait "$STAGES_WAITER" 2>/dev/null || true

            echo "superseded by ${SUPERSEDED_BY}"
            echo "superseded=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          wait "$STAGES_WAITER"
          STATUS=$?

          echo "superseded=false" >> "$GITHUB_OUTPUT"
          exit "$STATUS"

      # Everything a gate job needs to run without rebuilding anything: the two
      # stage binaries `ensure_stage` accepts on sight, stage2's emitted C, the
      # host compiler, the runtime archive the selfhost linker looks for at a
      # fixed path, and the std objects the host test run reuses. The ladder's
      # own results, G1 and G4 with the measurements behind them, travel with it
      # for the report. Paths are relative to the workspace, so a gate job
      # unpacks the artifact over its own checkout.
      - name: Upload the bootstrap stages
        if: always() && steps.stages.outputs.superseded != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-stages
          path: |
            build/bootstrap/stage0.json
            build/bootstrap/stage1/ignis
            build/bootstrap/stage2/ignis
            build/bootstrap/stage2/selfhost_emit.c
            build/bootstrap/*/measure.json
            build/bootstrap/*/log.txt
            build/bootstrap/gates/G1.json
            build/bootstrap/gates/G4.json
            build/selfhost/std/**
            std/runtime/libignis_rt.a
            target/ci/ignis
          if-no-files-found: ignore

  gate:
    name: Gate ${{ matrix.gate }}
    needs: stages
    if: needs.stages.outputs.superseded != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - gate: G2
            command: parity
            result: G2.json
          # Neither half decides anything on its own: they leave a log and an
          # exit status behind and `report` runs the comparison. The only result
          # file either can write is the one for a missing host compiler.
          - gate: G3-stage2
            command: gate-g3-stage2
            result: G3.json
          - gate: G3-host
            command: gate-g3-host
            result: G3.json
          - gate: G5
            command: gate-g5
            result: G5.json
          - gate: G6
            command: gate-g6
            result: G6.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Download the bootstrap stages
        uses: actions/download-artifact@v4
        with:
          name: bootstrap-stages

      # Artifacts carry no permission bits, and `ensure_stage` takes an existing
      # executable as the stage rather than rebuilding it.
      - name: Restore the executable bits
        run: |
          set -euo pipefail

          chmod +x build/bootstrap/stage1/ignis build/bootstrap/stage2/ignis target/ci/ignis
          echo "${GITHUB_WORKSPACE}/target/ci" >> "$GITHUB_PATH"

      # A gate is only worth its runner while its commit is still the head.
      - name: Check whether the head moved
        id: head
        env:
          BUILT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -uo pipefail

          # An unreachable remote is not evidence that the head moved.
          REMOTE_HEAD=$(git ls-remote --exit-code --heads origin refs/heads/main | awk '{print $1}') || REMOTE_HEAD=""

          if [ -n "$REMOTE_HEAD" ] && [ "$REMOTE_HEAD" != "$BUILT_SHA" ]; then
            echo "superseded by ${REMOTE_HEAD}"
            echo "superseded=true" >> "$GITHUB_OUTPUT"
          else
            echo "superseded=false" >> "$GITHUB_OUTPUT"
          fi

      # The gate file is the product: a non-zero exit is a recorded failure the
      # report reads, not a reason to lose the result.
      - name: Run ${{ matrix.gate }}
        if: steps.head.outputs.superseded != 'true'
        run: |
          scripts/bootstrap.sh ${{ matrix.command }} ||
            echo "${{ matrix.command }} exited non-zero; the gate file holds the verdict"

      # upload-artifact roots an artifact at the common ancestor of the files it
      # finds, which moves when a gate writes no report. Staging a fixed tree
      # keeps every gate artifact mergeable straight back into build/bootstrap.
      - name: Stage the gate result
        if: always() && steps.head.outputs.superseded != 'true'
        run: |
          set -euo pipefail

          mkdir -p upload/gates

          if [ -f "build/bootstrap/gates/${{ matrix.result }}" ]; then
            cp "build/bootstrap/gates/${{ matrix.result }}" upload/gates/
          fi

          for REPORT in parity.md parity-err.md parity-err.json parity-syntax.md parity-syntax.json; do
            if [ -f "build/bootstrap/${REPORT}" ]; then
              cp "build/bootstrap/${REPORT}" upload/
            fi
          done

          # The log and the status file are the G3 halves' product; the test
          # binary next to them is not worth an artifact.
          if [ -d build/bootstrap/stage2-tests ]; then
            mkdir -p upload/stage2-tests
            cp build/bootstrap/stage2-tests/log*.txt upload/stage2-tests/ || true
            cp build/bootstrap/stage2-tests/status-*.json upload/stage2-tests/ || true
          fi

      - name: Upload the gate result
        if: always() && steps.head.outputs.superseded != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-gate-${{ matrix.gate }}
          path: upload/
          if-no-files-found: ignore

  report:
    name: Promotion report
    needs: [stages, gate]
    # Runs on a failed or partly failed matrix too: a gate that produced no
    # result is a skipped gate, which is already not a candidate. `always()`
    # also runs a job whose dependencies were skipped, so the event condition
    # the ladder carries has to be repeated here.
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'success') &&
      needs.stages.outputs.superseded != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The job publishes the streak and the promoted binary to the nightly release.
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # A verdict for a commit `main` has moved past is not worth publishing, and
      # the streak must not move for it either.
      - name: Check whether the head moved
        id: head
        env:
          BUILT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -uo pipefail

          # An unreachable remote is not evidence that the head moved.
          REMOTE_HEAD=$(git ls-remote --exit-code --heads origin refs/heads/main | awk '{print $1}') || REMOTE_HEAD=""

          if [ -n "$REMOTE_HEAD" ] && [ "$REMOTE_HEAD" != "$BUILT_SHA" ]; then
            echo "superseded by ${REMOTE_HEAD}"
            echo "superseded=true" >> "$GITHUB_OUTPUT"
          else
            echo "superseded=false" >> "$GITHUB_OUTPUT"
          fi

      # G1 and the stage logs come from the ladder, the rest from the matrix. A
      # missing artifact is a job that failed before it produced one, which the
      # report records as a skipped gate.
      - name: Download the bootstrap stages
        if: steps.head.outputs.superseded != 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: bootstrap-stages

      - name: Download the gate results
        if: steps.head.outputs.superseded != 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: bootstrap-gate-*
          merge-multiple: true
          path: build/bootstrap

      # G3's two runs happened on a runner each and their logs only met here.
      # A half that produced nothing leaves the comparison with nothing to read,
      # which it records as a failed gate rather than a missing one.
      - name: Compare the G3 test runs
        if: steps.head.outputs.superseded != 'true'
        run: scripts/bootstrap.sh gate-g3-compare

      - name: Write the promotion report
        if: steps.head.outputs.superseded != 'true'
        run: |
          set -euo pipefail

          scripts/bootstrap.sh seal-gates
          scripts/bootstrap.sh report

      - name: Upload the bootstrap report
        if: always() && steps.head.outputs.superseded != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-report
          path: |
            build/bootstrap/report.md
            build/bootstrap/promotion.json
            build/bootstrap/parity.md
            build/bootstrap/gates/
            build/bootstrap/*/log.txt
            build/bootstrap/*/log-host.txt
            build/bootstrap/stage2/ignis
          if-no-files-found: ignore

      # The `release` job replaces this release's own assets and leaves the
      # streak file alone, so reading it here is the same value the job read
      # before its gates when they were serial.
      - name: Read the promotion streak
        id: streak
        if: steps.head.outputs.superseded != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          PREVIOUS_STREAK=0

          if gh release download nightly --pattern promotion-streak.json --dir streak 2>/dev/null; then
            PREVIOUS_STREAK=$(jq -r '.streak // 0' streak/promotion-streak.json)
          else
            echo "No promotion-streak.json on the nightly release; starting from zero."
          fi

          echo "previous_streak=${PREVIOUS_STREAK}" >> "$GITHUB_OUTPUT"

      - name: Publish the promotion state
        if: always() && steps.head.outputs.superseded != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIOUS_STREAK: ${{ steps.streak.outputs.previous_streak }}
        run: |
          set -euo pipefail

          if [ ! -f build/bootstrap/promotion.json ]; then
            echo "No promotion.json; the gate run did not get far enough to decide anything."
            exit 0
          fi

          CANDIDATE=$(jq -r '.candidate' build/bootstrap/promotion.json)
          COMMIT=$(jq -r '.commit' build/bootstrap/promotion.json)

          if [ "$CANDIDATE" = "true" ]; then
            STREAK=$(( ${PREVIOUS_STREAK:-0} + 1 ))
          else
            STREAK=0
          fi

          echo "candidate=${CANDIDATE} streak=${STREAK}"

          jq -n --arg commit "$COMMIT" --argjson streak "$STREAK" \
            '{commit: $commit, streak: $streak}' > promotion-streak.json

          if ! gh release view nightly >/dev/null 2>&1; then
            echo "No nightly release to publish to; the state stays in this run's artifacts."
            exit 0
          fi

          # Uploaded even on a reset: the streak file is state, not a promotion.
          gh release upload nightly promotion-streak.json --clobber

          if [ "$STREAK" -lt 3 ]; then
            echo "Not official yet; the published selfhost binary is left as it is."
            exit 0
          fi

          cp build/bootstrap/stage2/ignis ignis-selfhost-linux-amd64
          sha256sum ignis-selfhost-linux-amd64 > ignis-selfhost-linux-amd64.sha256

          gh release upload nightly \
            ignis-selfhost-linux-amd64 \
            ignis-selfhost-linux-amd64.sha256 \
            --clobber

      # Last, so that a failed run still leaves the report and the streak behind.
      - name: Fail when the run is not a promotion candidate
        if: success() && steps.head.outputs.superseded != 'true'
        run: |
          set -euo pipefail

          if [ ! -f build/bootstrap/promotion.json ]; then
            echo "The gate run produced no promotion.json."
            exit 1
          fi

          jq -r '.gates | to_entries[] | "\(.key): \(.value.status) — \(.value.summary)"' \
            build/bootstrap/promotion.json

          if [ "$(jq -r '.candidate' build/bootstrap/promotion.json)" != "true" ]; then
            echo "Not a promotion candidate: at least one gate did not pass."
            exit 1
          fi

          echo "Promotion candidate."
