name: Nightly

# Chained to CI rather than triggered by the push directly. Both would fire on
# the same commit, and re-running the gates here would repeat a selfhost job
# that already takes the better part of an hour. Waiting for the CI run also
# means a nightly asset only ever comes from a commit that passed every gate.
on:
  workflow_run:
    workflows: ["CI"]
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

# Unlike CI, an in-flight nightly is left to finish. The run force-moves a tag
# and rewrites one release's assets, so two runs racing on the same rolling
# release can interleave a delete from one with an upload from the other.
concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Kept in step with the flake and with ci.yml. A floating channel makes a red
  # run here mean something different from a red run on a developer machine.
  RUST_NIGHTLY: nightly-2026-04-22

jobs:
  release:
    name: Publish rolling nightly
    # A failed or cancelled CI run publishes nothing. `workflow_dispatch` has no
    # originating run, so it is allowed through on its own.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # `workflow_run` starts from the default branch, which may already have
          # moved on. Build the commit CI actually verified.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_NIGHTLY }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: nightly-linux-amd64
          cache-targets: true
          cache-on-failure: true

      # `.cargo/config.toml` selects mold for the Linux targets, so it has to be
      # present before any cargo invocation links.
      - name: Install mold
        run: |
          sudo apt-get update
          sudo apt-get install -y mold

      - name: Build the C runtime archive
        run: make -C std/runtime

      - name: Build Ignis
        run: cargo build --release --locked -p ignis

      - name: Create package
        run: |
          mkdir -p pkg/scripts

          cp target/release/ignis pkg/ignis
          chmod +x pkg/ignis

          cp -r std pkg/std
          cp scripts/install.sh pkg/scripts/
          cp scripts/uninstall.sh pkg/scripts/
          cp scripts/PKGBUILD pkg/scripts/
          chmod +x pkg/scripts/install.sh pkg/scripts/uninstall.sh

      - name: Create tar archive
        run: tar -czf ignis-nightly-linux-amd64.tar.gz -C pkg .

      - name: Generate checksum
        run: sha256sum ignis-nightly-linux-amd64.tar.gz > ignis-nightly-linux-amd64.tar.gz.sha256

      # The nightly carries documentation for the same reason a release does, and it
      # is the only bundle that exists until the next release: without it the website
      # has guides but no API reference for anything.
      - name: Build documentation bundle
        run: |
          mkdir -p docs-pkg

          cp -r docs/web docs-pkg/guides

          # The standard library has no root module. Any std entry makes the driver
          # discover every module in the manifest, so documenting one documents all.
          ./target/release/ignis doc std/io/mod.ign --std-path std --output docs-pkg/api.json

      - name: Create documentation archive
        run: tar -czf ignis-docs.tar.gz -C docs-pkg .

      - name: Generate documentation checksum
        run: sha256sum ignis-docs.tar.gz > ignis-docs.tar.gz.sha256

      - name: Compose release body
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          DATE=$(date -u '+%Y-%m-%d')
          cat > release_body.md <<EOF
          > **Nightly build** — produced from \`main\` on every green CI run.
          > Assets are replaced on each run, so a download is only reproducible
          > against the commit named below.
          >
          > Commit: \`${SHORT_SHA}\` — ${DATE}
          EOF

      - name: Move the nightly tag to this commit
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git tag -f nightly HEAD
          git push origin nightly --force

      - name: Prune the previous nightly assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # The release is reused rather than deleted, so its old assets have to
          # go explicitly or they accumulate under names that no longer match the
          # commit. A missing release is the first run, not an error.
          RELEASE_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/nightly" 2>/dev/null || true)
          if [ -z "$RELEASE_JSON" ]; then
            echo "No nightly release yet; nothing to prune."
            exit 0
          fi

          ASSET_IDS=$(jq -r '.assets[]?.id // empty' <<<"$RELEASE_JSON")
          if [ -z "$ASSET_IDS" ]; then
            echo "Nightly release has no assets to prune."
            exit 0
          fi

          while IFS= read -r ASSET_ID; do
            [ -n "$ASSET_ID" ] || continue
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}"
          done <<<"$ASSET_IDS"

      - name: Publish
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: nightly
          name: Ignis Nightly
          body_path: release_body.md
          prerelease: true
          files: |
            ignis-nightly-linux-amd64.tar.gz
            ignis-nightly-linux-amd64.tar.gz.sha256
            ignis-docs.tar.gz
            ignis-docs.tar.gz.sha256

      # The website reads the guides from this release's `ignis-docs.tar.gz`, so a
      # documentation change is only live once the site is rebuilt against the new
      # asset. Nothing else connects the two repositories: without this the site
      # keeps serving whatever bundle existed at its last build.
      #
      # Runs only after Publish succeeded, so a failed upload never triggers a
      # build against a stale bundle. The hook URL is the credential, which is why
      # it is a secret and never echoed.
      - name: Trigger the website build
        if: success()
        env:
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_WEBHOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "CLOUDFLARE_WEBHOOK is not set; skipping the website build."
            exit 0
          fi

          STATUS=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$DEPLOY_HOOK")

          if [ "$STATUS" != "200" ]; then
            echo "Deploy hook returned HTTP $STATUS."
            exit 1
          fi

          echo "Website build triggered."

  # The bootstrap ladder is the selfhost fixed-point gate: stage2 (built by the
  # host-built compiler) and stage3 (built by stage2) must emit the same C.
  # Each self-compilation takes around fifteen minutes locally, so it runs here
  # once per green commit instead of on every pull request.
  #
  # Promotion flow
  # --------------
  # `scripts/bootstrap.sh gates` runs every stage and gate and writes
  # build/bootstrap/promotion.json. A run is a *candidate* when every gate
  # passes; the job's own red or green is that verdict, decided after the
  # artifacts are uploaded so a failing run is still readable.
  #
  # The streak of consecutive candidate runs lives in the `promotion-streak.json`
  # asset of the rolling nightly release: it is read at the start of the job and
  # written back at the end. At three consecutive candidates the stage2 binary is
  # published as `ignis-selfhost-linux-amd64`, and the streak keeps counting.
  # A run that is not a candidate resets the streak to zero and uploads no
  # selfhost binary, which leaves the last published one in place.
  bootstrap:
    name: Bootstrap ladder
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 300

    # The job publishes the streak and the promoted binary to the nightly release.
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_NIGHTLY }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v0-rust"
          shared-key: "ci-selfhost"
          cache-targets: true
          cache-on-failure: true

      # Same pinned tarball as ci.yml: the distribution package hung on an
      # unresponsive mirror once and burned the whole budget.
      - name: Install mold
        timeout-minutes: 3
        env:
          MOLD_VERSION: 2.42.0
        run: |
          curl -fsSL --retry 3 --retry-delay 2 \
            "https://github.com/rui314/mold/releases/download/v${MOLD_VERSION}/mold-${MOLD_VERSION}-x86_64-linux.tar.gz" \
            | sudo tar -xz --strip-components=1 -C /usr/local
          mold --version

      - name: Build the C runtime archive
        run: make -C std/runtime

      - name: Build Ignis
        run: cargo build --locked -p ignis

      - name: Add Ignis to PATH
        run: echo "${GITHUB_WORKSPACE}/target/debug" >> "$GITHUB_PATH"

      # Read before the gates run, which is also before the `release` job has
      # replaced this release's assets. A missing asset is the first run.
      - name: Read the promotion streak
        id: streak
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          PREVIOUS_STREAK=0

          if gh release download nightly --pattern promotion-streak.json --dir streak 2>/dev/null; then
            PREVIOUS_STREAK=$(jq -r '.streak // 0' streak/promotion-streak.json)
          else
            echo "No promotion-streak.json on the nightly release; starting from zero."
          fi

          echo "previous_streak=${PREVIOUS_STREAK}" >> "$GITHUB_OUTPUT"

      # Every gate writes its own result and the report is produced even when
      # gates fail, so this step is expected to succeed whatever the verdict is.
      - name: Run the bootstrap gates
        run: scripts/bootstrap.sh gates

      - name: Upload the bootstrap report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-report
          path: |
            build/bootstrap/report.md
            build/bootstrap/promotion.json
            build/bootstrap/parity.md
            build/bootstrap/gates/
            build/bootstrap/*/log.txt
            build/bootstrap/*/log-host.txt
            build/bootstrap/stage2/ignis
          if-no-files-found: ignore

      - name: Publish the promotion state
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIOUS_STREAK: ${{ steps.streak.outputs.previous_streak }}
        run: |
          set -euo pipefail

          if [ ! -f build/bootstrap/promotion.json ]; then
            echo "No promotion.json; the gate run did not get far enough to decide anything."
            exit 0
          fi

          CANDIDATE=$(jq -r '.candidate' build/bootstrap/promotion.json)
          COMMIT=$(jq -r '.commit' build/bootstrap/promotion.json)

          if [ "$CANDIDATE" = "true" ]; then
            STREAK=$(( ${PREVIOUS_STREAK:-0} + 1 ))
          else
            STREAK=0
          fi

          echo "candidate=${CANDIDATE} streak=${STREAK}"

          jq -n --arg commit "$COMMIT" --argjson streak "$STREAK" \
            '{commit: $commit, streak: $streak}' > promotion-streak.json

          if ! gh release view nightly >/dev/null 2>&1; then
            echo "No nightly release to publish to; the state stays in this run's artifacts."
            exit 0
          fi

          # Uploaded even on a reset: the streak file is state, not a promotion.
          gh release upload nightly promotion-streak.json --clobber

          if [ "$STREAK" -lt 3 ]; then
            echo "Not official yet; the published selfhost binary is left as it is."
            exit 0
          fi

          cp build/bootstrap/stage2/ignis ignis-selfhost-linux-amd64
          sha256sum ignis-selfhost-linux-amd64 > ignis-selfhost-linux-amd64.sha256

          gh release upload nightly \
            ignis-selfhost-linux-amd64 \
            ignis-selfhost-linux-amd64.sha256 \
            --clobber

      # Last, so that a failed run still leaves the report and the streak behind.
      - name: Fail when the run is not a promotion candidate
        run: |
          set -euo pipefail

          if [ ! -f build/bootstrap/promotion.json ]; then
            echo "The gate run produced no promotion.json."
            exit 1
          fi

          jq -r '.gates | to_entries[] | "\(.key): \(.value.status) — \(.value.summary)"' \
            build/bootstrap/promotion.json

          if [ "$(jq -r '.candidate' build/bootstrap/promotion.json)" != "true" ]; then
            echo "Not a promotion candidate: at least one gate did not pass."
            exit 1
          fi

          echo "Promotion candidate."
