# Link the Linux targets with mold.
#
# Requires `mold` on PATH. The Nix dev shell provides it, `default.nix` ships it
# with the package build, and the CI and release workflows install a pinned
# upstream release. On a non-Nix machine, install it from your package manager.
#
# This applies to every cargo invocation for these triples, release included.
# It changes link time, not the produced binary. Other triples keep their
# default linker.
#
# It does not affect the `gcc` calls the driver makes to compile generated C:
# those are spawned by the compiler at run time and never consult this file.

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=mold"]
